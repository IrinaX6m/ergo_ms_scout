name: Scout tests

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: scout-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django + PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: scout_ci
          POSTGRES_USER: scout_ci
          POSTGRES_PASSWORD: scout_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout_ci -d scout_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      API_SECRET_KEY: scout-ci-local-test-signing-key-not-used-in-deployment
      DATABASE_TEST_CONNECTIONS: 'false'
      DJANGO_SETTINGS_MODULE: src.config.patterns.development
      ERGO_DB: postgres
      ERGO_MEDIA: local
      ERGO_REALTIME: http_polling
      ERGO_SEARCH_ENABLED: 'false'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
      PROCESS_MODULES: scout
      PYTHONPATH: ${{ github.workspace }}/platform:${{ github.workspace }}/platform/core/api
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Checkout ERGOMS platform
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ergoms/ergo_ms_core
          ref: 9f6e859efd6d7e84167df1f5b2a09fc756222e8b
          path: platform
          persist-credentials: false
      - name: Checkout the pinned Django API
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ergoms/ergo_ms_core_api
          ref: 7efe19127bf7a1fff326a6f27498bd872a4b3fe2
          path: platform/core/api
          persist-credentials: false
      - name: Checkout Scout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: platform/modules/scout
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install poetry==2.4.1
          poetry install --only main --no-root
          poetry run python -m pip install 'lxml>=5.0,<7.0'
      - name: Configure test database
        run: |
          cat > databases.yaml <<'YAML'
          databases:
            default:
              engine: postgresql
              name: scout_ci
              user: scout_ci
              password: scout_ci
              host: 127.0.0.1
              port: 5432
          YAML
      - name: Check migrations and run Scout tests
        run: |
          poetry run python -m src.manage makemigrations --check --dry-run scout
          poetry run python -m src.manage test modules.scout.api --noinput
