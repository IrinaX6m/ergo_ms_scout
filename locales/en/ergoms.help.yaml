title: "SCOUT"
summary: "Collect records from an HTML page after the plan is confirmed"
commands:
  collect:
    summary: "Create a job from a page address and queue the download"
  approve-run:
    summary: "Confirm the run plan and queue record extraction"
notes:
  - "Crawl: --crawl site --allow-host example.com --visit-prefix /catalog --extract-prefix /catalog/item --depth 2 --max-pages 50"
  - "Sitemap or sitemap index for crawling: --crawl site --sitemap-url https://example.com/sitemap.xml"
  - "Discover sitemaps in /robots.txt of the first --url: --crawl site --sitemap-from-robots; without --sitemap-url"
  - "Budget: --max-seconds 600 --max-total-bytes 20000000 --frontier-cap 200 --parallel-fetch 2 --fetch-delay-ms 0"
  - "Preview: --preview-url https://example.com/catalog/item/1 --preview-pages 3; full crawl starts only after approve-run"
